[project]
name = "mira-core"
dynamic = ["version"]
description = "Mira — local AI assistant with autonomous web search, RAG, and a web UI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ollama>=0.4.0,<2.0.0",
    "ddgs>=6.0.0",
    "rich>=13.0.0,<15.0.0",
    "markdown>=3.5.0,<4.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sse-starlette>=2.0.0,<3.0.0",
    "pymupdf>=1.27.2.2,<2.0.0",
    "beautifulsoup4>=4.14.3,<5.0.0",
    "python-multipart>=0.0.31",
    "chromadb>=1.5.5,<2.0.0",
    "sentence-transformers>=5.3.0,<6.0.0",
    "httpx>=0.28.1,<1.0.0",
    "trafilatura>=1.12,<2.0",
    "markdownify>=0.13,<1.0",
    "curl_cffi>=0.7,<1.0",
    "mlx>=0.31.2; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
    "mlx-metal>=0.31.2; sys_platform == 'darwin'",
    "dflash-mlx>=0.1.8; sys_platform == 'darwin'",
    "openai>=2.37.0",
    "pyyaml>=6.0.3",
    "einops>=0.8.2",
    "dateparser>=1.4.0",
    "pillow>=12.3.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "idna>=3.15",
]

[project.scripts]
mira = "mira_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from the git tag (e.g. tag v0.8.2 -> package 0.8.2). The tag
# is the single source of truth; never hardcode a version here.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
# Flat-layout repo: ship the core package plus the top-level entry modules.
include = ["core", "mira_cli.py", "main.py", "server.py"]

[tool.uv]
package = true

# Pinned to a dedicated stable branch (decoupled from mira-mistral-tool-call-fix,
# which gets rebased/force-pushed for upstream PR prep and isn't safe to track
# directly) carrying: the Mistral tool-call-flush fix (needed for Mistral-family
# tool calling — empty tool_call_end_tokens defeats the stock EOS flush check;
# upstream's own PR #1373 for this was closed, not merged) and KV-cache
# quantization for the continuous-batching path (specs/mira-mlx-kv-quant.md).
# Do NOT bump this to a newer upstream-rebased commit without first verifying
# mira_mlx_server.py's SequenceStateMachine import still resolves — upstream's
# 2026-07 "Text-based state machine for tool/reasoning parsing" refactor
# (PR #1501) renamed/replaced it with TextStateMachine, a different API.
[tool.uv.sources]
mlx-lm = { git = "https://github.com/mabaeyens/mlx-lm.git", rev = "e2b26fd18fe18a7415938199ca0331d6b2891c12" }
