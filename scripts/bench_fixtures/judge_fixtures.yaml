# Answers whose correct verdict is already known, used to prove the judge before
# any of its scores are believed.
#
# A wrong judge is worse than no judge: a blank column is visibly blank, while a
# wrong number gets quoted. On 2026-08-08 a regex judge scored a CORRECT answer
# to Q4 as failing and was one step from being written into a results table. The
# `context_manager_correct` fixture below is that exact case.
#
# `accept` is an inclusive range. It is tight where the answer is unambiguous and
# wide where a defensible judge could reasonably differ — a fixture set that
# demands one exact score for a genuinely borderline answer measures agreement
# with its author, not judge quality.

fixtures:
