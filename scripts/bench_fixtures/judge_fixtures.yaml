  - name: context_manager_correct
    accept: [2, 2]
    prompt: "Write a complete Python context manager that wraps a sqlite3 connection: handles transactions, rolls back on exception, logs queries to stderr if LOG_SQL=1 env var is set. Include type hints."
    rubric: |
      A context manager wrapping sqlite3 with four required properties:
      commits on clean exit, rolls back on exception, logs queries to stderr
      only when LOG_SQL=1, and carries type hints.
      2 = all four present and correct, including re-raising rather than
          swallowing the exception after rollback.
      1 = three of four, or all four with a real flaw.
      0 = fewer than three, or not a working context manager.
    answer: |
      ```python
      import os
      import sqlite3
      import sys
      from contextlib import contextmanager
      from typing import Iterator

      class _LoggingConnection(sqlite3.Connection):
          def execute(self, sql: str, *args, **kwargs) -> sqlite3.Cursor:
              if os.environ.get("LOG_SQL") == "1":
                  print(sql, file=sys.stderr)
              return super().execute(sql, *args, **kwargs)

      @contextmanager
      def transaction(path: str) -> Iterator[sqlite3.Connection]:
          conn = sqlite3.connect(path, factory=_LoggingConnection)
          try:
              yield conn
          except Exception:
              conn.rollback()
              raise
          else:
              conn.commit()
          finally:
              conn.close()
      ```
      Commits on clean exit, rolls back and re-raises on failure, and only logs
      when LOG_SQL=1.

  - name: context_manager_swallows_exception
    accept: [0, 1]
    prompt: "Write a complete Python context manager that wraps a sqlite3 connection: handles transactions, rolls back on exception, logs queries to stderr if LOG_SQL=1 env var is set. Include type hints."
    rubric: |
      A context manager wrapping sqlite3 with four required properties:
      commits on clean exit, rolls back on exception, logs queries to stderr
      only when LOG_SQL=1, and carries type hints.
      2 = all four present and correct, including re-raising rather than
          swallowing the exception after rollback.
      1 = three of four, or all four with a real flaw.
      0 = fewer than three, or not a working context manager.
    answer: |
      ```python
      import sqlite3
      from contextlib import contextmanager

      @contextmanager
      def transaction(path):
          conn = sqlite3.connect(path)
          try:
              yield conn
              conn.commit()
          except Exception as e:
              conn.rollback()
              print("error", e)
          finally:
              conn.close()
      ```
      This handles transactions and rolls back on failure.

