questions:
  - id: 1
    difficulty: easy
    category: baseline
    tools: false
    thinking: false
    prompt: "What is 2+2? Reply with just the number."
    expected_tool_calls: 0
    notes: "Micro-benchmark — TTFT and cold-load penalty only."

  - id: 2
    difficulty: easy
    category: code-no-tools
    tools: false
    thinking: false
    prompt: "Write a Python function that parses a log line in format 'YYYY-MM-DD HH:MM:SS [LEVEL] message' and returns a dict with keys: date, level, message."
    expected_tool_calls: 0
    notes: "Classic code gen. No reasoning required."

  - id: 3
    difficulty: medium
    category: reasoning
    tools: false
    thinking: false
    prompt: "A FastAPI server returns 503 intermittently under load. Walk through a systematic debugging approach — list concrete steps."
    expected_tool_calls: 0
    notes: "Run twice for question 5: once thinking=false, once thinking=true."

  - id: 4
    difficulty: medium
    category: long-output
    tools: false
    thinking: false
    prompt: "Write a complete Python context manager that wraps a sqlite3 connection: handles transactions, rolls back on exception, logs queries to stderr if LOG_SQL=1 env var is set. Include type hints."
    expected_tool_calls: 0
    notes: "Stress-tests generation throughput — long output expected."

  - id: 5
    difficulty: medium
    category: thinking-toggle
    tools: false
    thinking: true
    prompt: "A FastAPI server returns 503 intermittently under load. Walk through a systematic debugging approach — list concrete steps."
    expected_tool_calls: 0
    notes: "Same prompt as Q3 with thinking enabled. Compare quality delta and wall-time cost."

  - id: 6
    difficulty: hard
    category: agentic-single-tool
    tools: true
    thinking: false
    prompt: "Using a single shell command, count the total number of lines across all .py files in {workspace_root}/core — exclude __pycache__. Show only the total line count."
    expected_tool_calls: 1
    notes: "Expects run_shell with find + wc -l on explicit local path. Single tool call sufficient. GitHub tools cannot fulfill this."

  - id: 7
    difficulty: hard
    category: agentic-multi-step
    tools: true
    thinking: false
    prompt: "Using a single shell command, find all TODO and FIXME comments in {workspace_root} — exclude .venv, .git, and __pycache__. For each match include the filename, line number, and the full comment text. Group results by file and output as a markdown list."
    expected_tool_calls: 2
    notes: "Expects grep via run_shell on explicit local path. Record actual tool call count. GitHub tools cannot fulfill this."

  - id: 8
    difficulty: hard
    category: agentic-read-reason
    tools: true
    thinking: false
    prompt: "Read the file {workspace_root}/core/orchestrator.py and explain how the divergence guard works. What exactly triggers it, what does it check, and what does it emit when triggered? Quote the relevant code."
    expected_tool_calls: 1
    notes: "Expects read_file on explicit local path, then reasoning. Correct answer: identical tool+args repeated 3 times triggers an error SSE event."

  - id: 9
    difficulty: expert
    category: agentic-task-done
    tools: true
    thinking: false
    prompt: "Create the file /tmp/mira_bench_test.txt containing today's date and the string 'bench OK'. Then verify the file exists and contains the right content. Report what you found."
    expected_tool_calls: 3
    notes: "Expects: run_shell (write) + run_shell (verify) + task_done. Check that task_done fires."

  - id: 11
    difficulty: hard
    category: agentic-write-file
    tools: true
    thinking: false
    prompt: "Create the file bench/write_test.txt in the workspace containing exactly two lines: the current date in YYYY-MM-DD format, and the text 'write_file bench OK'. Read it back to confirm the content is correct."
    expected_tool_calls: 2
    notes: "Expects write_file + read_file. Score 2/2 if write_file used with correct content; 1/2 if run_shell (echo) used with correct content; 0/2 if content wrong."

  - id: 12
    difficulty: hard
    category: agentic-edit-file
    tools: true
    thinking: false
    prompt: "In the workspace, create the file bench/edit_test.txt containing the single line 'status: pending'. Then change the status to 'complete' and read the file back to confirm."
    expected_tool_calls: 3
    notes: "Expects write_file + edit_file + read_file. Score 2/2 if both tools used with correct final content; 1/2 if run_shell substitution used with correct content; 0/2 if content wrong."

  - id: 10
    difficulty: expert
    category: multi-turn-long-context
    tools: false
    thinking: false
    turns: 2
    prompt_turn1: "__INJECT_SERVER_PY__"
    prompt_turn2: "In the file I just shared, where is the agentic loop's divergence guard implemented? Quote the exact code block that detects repeated identical tool calls."
    expected_tool_calls: 0
    notes: "Turn 1 pastes server.py contents (~context stress). Turn 2 tests retrieval. bench_compare.py replaces __INJECT_SERVER_PY__ with actual file contents."
