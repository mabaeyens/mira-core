name: CI

on:
  pull_request:        # external contributions only; solo work goes straight to main
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DOWNLOAD_TIMEOUT: "60"   # fail a stuck download fast instead of hanging
      # conftest.py neutralizes a stray local mira.yaml by pointing the loader at
      # /dev/null via setdefault("MIRA_CONFIG", ...). Setting it explicitly here is
      # exactly the escape hatch that setdefault leaves open: it makes the loader read
      # the mira.yaml this job writes below (crossencoder reranker + shell_sandbox off),
      # instead of the empty /dev/null, so those two Linux-only overrides take effect.
      MIRA_CONFIG: ${{ github.workspace }}/mira.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # hatch-vcs derives the version from git history

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('core/config.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Provision env (CPU reranker + default workspace dir)
        run: |
          # mlx is macOS-only and excluded on Linux runners → use the CPU reranker.
          printf 'reranker_backend: crossencoder\n' > mira.yaml
          # run_shell's OS sandbox uses macOS sandbox-exec, which is absent on Linux
          # runners; SHELL_SANDBOX defaults on, so run_shell would fail closed. Disable
          # it here so shell-tool tests exercise real command execution. The sandbox
          # behaviour itself is covered by test_shell_sandbox.py (skipped off macOS).
          printf 'shell_sandbox: false\n' >> mira.yaml
          # run_shell defaults its root to WORKSPACE_ROOT (~/workspace); the server
          # expects this dir to exist. Create it so shell-tool tests have a workspace.
          mkdir -p "$HOME/workspace"

      # `.python-version` pins 3.13 for local dev, and it outranks both the
      # UV_PYTHON that setup-uv exports and any bare `uv run`. CI deliberately
      # runs the 3.12 floor declared in pyproject's requires-python instead, so
      # every `uv run` below passes --python explicitly: the CLI flag is the one
      # thing that does outrank the file.
      - name: Prefetch models (warms HF cache; retries transient errors)
        run: uv run --python 3.12 --group dev python scripts/prefetch_models.py

      # No deselects. The 9 that used to live here were repaired 2026-07-26;
      # they had been failing on macOS too, so "Linux runner" was a red herring.
      - name: Run tests
        run: >
          uv run --python 3.12 --group dev python -m pytest -p no:cacheprovider -q

      # A full sweep cannot catch this one. db.init_db() runs in production only
      # from server.py's lifespan, and until 2026-08-02 the suite got its schema
      # purely because tests/test_auth.py sorts early and starts a TestClient.
      # conftest.py now calls init_db() itself, but a full run would stay green
      # if that call were removed — test_auth would create the tables first, as
      # before. Running modules that touch the DB without standing up the app is
      # what actually proves the schema does not depend on test ordering.
      - name: Schema must not depend on test order
        run: >
          uv run --python 3.12 --group dev python -m pytest -p no:cacheprovider -q
          tests/test_data_isolation.py tests/test_tools_enabled.py
