name: CI

on:
  pull_request:        # external contributions only; solo work goes straight to main
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DOWNLOAD_TIMEOUT: "60"   # fail a stuck download fast instead of hanging
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # hatch-vcs derives the version from git history

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('core/config.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Provision env (CPU reranker + default workspace dir)
        run: |
          # mlx is macOS-only and excluded on Linux runners → use the CPU reranker.
          printf 'reranker_backend: crossencoder\n' > mira.yaml
          # run_shell's OS sandbox uses macOS sandbox-exec, which is absent on Linux
          # runners; SHELL_SANDBOX defaults on, so run_shell would fail closed. Disable
          # it here so shell-tool tests exercise real command execution. The sandbox
          # behaviour itself is covered by test_shell_sandbox.py (skipped off macOS).
          printf 'shell_sandbox: false\n' >> mira.yaml
          # run_shell defaults its root to WORKSPACE_ROOT (~/workspace); the server
          # expects this dir to exist. Create it so shell-tool tests have a workspace.
          mkdir -p "$HOME/workspace"

      - name: Prefetch models (warms HF cache; retries transient errors)
        run: uv run --group dev python scripts/prefetch_models.py

      # No deselects. The 9 that used to live here were repaired 2026-07-26;
      # they had been failing on macOS too, so "Linux runner" was a red herring.
      - name: Run tests
        run: >
          uv run --group dev python -m pytest -p no:cacheprovider -q
